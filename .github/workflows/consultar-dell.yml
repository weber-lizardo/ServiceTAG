name: Consultar Service Tags na Dell

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: consultar-dell
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://dwjseiqsqjcafkflowkd.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # Verificação rápida: só instala o navegador se houver tag pendente.
      - name: Verificar tags pendentes
        id: pendentes
        run: |
          total=$(curl -sf \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/servicetag_service_tags?situacao=eq.pendente&select=id&limit=1" \
            | grep -o '"id"' | wc -l)
          echo "Pendentes: $total"
          echo "existe=$([ "$total" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.pendentes.outputs.existe == 'true'
        uses: actions/checkout@v4

      - if: steps.pendentes.outputs.existe == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.pendentes.outputs.existe == 'true'
        run: npm ci

      - if: steps.pendentes.outputs.existe == 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.pendentes.outputs.existe == 'true'
        run: node worker.js
